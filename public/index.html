        };

        const PollDetail = ({ user, userData, poll: initialPoll, onBack, setModalState, showToast, selectedClass, classData, classes, onEdit, onCopy }) => {
            const [poll, setPoll] = useState(initialPoll);
            useEffect(() => {
                if (!initialPoll?.id) return;
                const unsub = db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(initialPoll.id).onSnapshot(doc => {
                    if (doc.exists) {
                        setPoll({ id: doc.id, ...doc.data() });
                    }
                });
                return () => unsub();
            }, [initialPoll?.id]);

            const isTeacher = user.role === 'teacher';
            const isCreator = poll.creatorId === user.uid;
            const canManage = isCreator || isTeacher || user.email === '100jihyun@somyong.ms.kr';
            const isExpired = poll.deadline && new Date() > new Date(poll.deadline);
            const [responses, setResponses] = useState({}); // Stores user's current selections { qId: value }
            const [hasVoted, setHasVoted] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [localStatus, setLocalStatus] = useState(poll.status);
            const [expandedVoters, setExpandedVoters] = useState({});

            const toggleVoters = (key) => setExpandedVoters(prev => ({ ...prev, [key]: !prev[key] }));

            const handleReleaseScores = async () => {
                setModalState({
                    isOpen: true,
                    isConfirm: true,
                    title: '점수 공개',
                    content: '점수를 공개하시겠습니까? 공개 후에는 학생들이 자신의 점수를 확인할 수 있습니다.',
                    confirmText: '공개하기',
                    onConfirm: async () => {
                        try {
                            await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).update({
                                scoresReleased: true
                            });
                            showToast('점수가 공개되었습니다.');
                            return true;
                        } catch (error) {
                            console.error('Error releasing scores:', error);
                            showToast('점수 공개 중 오류가 발생했습니다.');
                            return false;
                        }
                    }
                });
            };

            const handleViewStudentScores = () => {
                const maxPossibleScore = poll.questions.reduce((acc, q) => acc + (q.type !== 'rating' ? (q.points || 0) : 0), 0);

                const checkCorrect = (q, myAns) => {
                    if (!poll.isQuiz || !q.correctAnswer) return false;
                    if (q.type === 'single') return myAns === q.correctAnswer;
                    if (q.type === 'text') {
                        const answersArray = Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer];
                        return answersArray.some(ans => ans.trim() === (myAns || '').trim());
                    }
                    if (q.type === 'multiple') {
                        if (!Array.isArray(myAns) || !Array.isArray(q.correctAnswer)) return false;
                        if (myAns.length !== q.correctAnswer.length) return false;
                        return q.correctAnswer.every(val => myAns.includes(val));
                    }
                    if (q.type === 'grid') {
                        if (!myAns) return false;
                        return q.rows.every(row => myAns[row] === q.correctAnswer[row]);
                    }
                    return false;
                };

                const studentScores = pollResults.map(vote => {
                    let score = 0;
                    poll.questions.forEach(q => {
                        if (q.type === 'rating') return;
                        if (checkCorrect(q, vote.answers[q.id])) {
                            score += (q.points || 0);
                        }
                    });
                    return {
                        name: vote.voterName,
                        score: score
                    };
                });

                studentScores.sort((a, b) => b.score - a.score);

                const content = (
                    <div className="max-h-[60vh] overflow-y-auto mt-4">
                        <table className="min-w-full text-center">
                            <thead className="bg-gray-50 border-b sticky top-0">
                                <tr>
                                    <th className="p-3 font-bold text-gray-600">순위</th>
                                    <th className="p-3 font-bold text-gray-600">학생 이름</th>
                                    <th className="p-3 font-bold text-gray-600">점수</th>
                                </tr>
                            </thead>
                            <tbody>
                                {studentScores.length === 0 ? (
                                    <tr><td colSpan="3" className="p-4 text-gray-500">제출한 학생이 없습니다.</td></tr>
                                ) : studentScores.map((s, idx) => (
                                    <tr key={idx} className="border-b hover:bg-gray-50">
                                        <td className="p-3 font-bold">{idx + 1}</td>
                                        <td className="p-3">{s.name}</td>
                                        <td className="p-3 font-bold text-purple-700">{s.score} <span className="text-xs text-gray-400">/ {maxPossibleScore}</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                );

                setModalState({
                    isOpen: true,
                    title: '학생 점수 확인',
                    content: content,
                    confirmText: '닫기',
                    onConfirm: () => setModalState({ isOpen: false }),
                    size: 'max-w-2xl'
                });
            };

            useEffect(() => {
                setLocalStatus(poll.status);
            }, [poll.status]);

            // Results
            const [pollResults, setPollResults] = useState([]); // Raw vote docs
            const [loadingResults, setLoadingResults] = useState(true);

            const fetchResults = async () => {
                setLoadingResults(true);
                const snapshot = await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).collection('votes').get();
                const votes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setPollResults(votes);
                const myVote = votes.find(v => v.voterId === user.uid);
                if (myVote) {
                    setHasVoted(true);
                    setResponses(myVote.answers);
                }
                setLoadingResults(false);
            };

            // Check if user has voted and load results if needed
            useEffect(() => {
                if (!poll?.id) return;

                if (isTeacher) {
                    const unsub = db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).collection('votes')
                        .onSnapshot(snapshot => {
                            const votes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setPollResults(votes);
                            const myVote = votes.find(v => v.voterId === user.uid);
                            if (myVote) {
                                setHasVoted(true);
                                setResponses(myVote.answers);
                            }
                            setLoadingResults(false);
                        });
                    return () => unsub();
                } else {
                    fetchResults();
                }
            }, [poll?.id, user.uid, isTeacher]);

            const handleOptionSelect = (qId, type, value) => {
                if (hasVoted || localStatus !== 'active' || isExpired) return;

                setResponses(prev => {
                    const current = prev[qId];
                    if (type === 'single') {
                        return { ...prev, [qId]: value };
                    } else if (type === 'multiple') {
                        const arr = Array.isArray(current) ? current : [];
                        if (arr.includes(value)) {
                            return { ...prev, [qId]: arr.filter(v => v !== value) };
                        } else {
                            const q = poll.questions.find(quest => quest.id === qId);
                            if (q && q.maxSelections && arr.length >= q.maxSelections) {
                                showToast(`최대 ${q.maxSelections}개까지만 선택 가능합니다.`);
                                return prev;
                            }
                            return { ...prev, [qId]: [...arr, value] };
                        }
                    } else if (type === 'rating') {
                        return { ...prev, [qId]: value };
                    } else if (type === 'grid') {
                        const { row, opt } = value;
                        return { ...prev, [qId]: { ...(prev[qId] || {}), [row]: opt } };
                    } else if (type === 'text') {
                        return { ...prev, [qId]: value };
                    }
                    return prev;
                });
            };

            const handleSubmitVote = async () => {
                // Validate
                for (const q of poll.questions) {
                    const ans = responses[q.id];
                    if (!ans || (Array.isArray(ans) && ans.length === 0)) {
                        showToast('모든 질문에 응답해주세요.');
                        return;
                    }
                }

                setSubmitting(true);
                try {
                    const voteData = {
                        voterId: user.uid,
                        voterName: userData.name,
                        votedAt: new Date().toISOString(),
                        answers: responses
                    };

                    // Handle anonymity at question level. If any question is NOT anonymous, we might need to store identity.
                    // For simplicity, we store identity in the vote doc, but when displaying results, we check q.allowAnonymous.
                    // If ALL questions are anonymous, we could omit voterName, but let's keep it and filter at display time.

                    await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).collection('votes').doc(user.uid).set(voteData);

                    if (!isTeacher) {
                        setPollResults(prev => {
                            const filtered = prev.filter(v => v.voterId !== user.uid);
                            return [...filtered, { id: user.uid, ...voteData }];
                        });
                    }

                    showToast('투표가 완료되었습니다.');
                    setHasVoted(true);
                } catch (e) {
                    console.error(e);
                    showToast('투표 제출 중 오류가 발생했습니다.');
                } finally {
                    setSubmitting(false);
                }
            };

            const handleApprove = async () => {
                await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).update({ status: 'active' });
                setLocalStatus('active');
                showToast('투표가 승인되어 시작되었습니다.');
            };

            const handleClose = async () => {
                await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).update({ status: 'closed' });
                setLocalStatus('closed');
                showToast('투표가 마감되었습니다.');
            };

            const handleReopen = async () => {
                if (!isTeacher && user.email !== '100jihyun@somyong.ms.kr') {
                    showToast('권한이 없습니다.');
                    return;
                }
                await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).update({ status: 'active' });
                setLocalStatus('active');
                showToast('투표 마감이 취소되고 다시 시작되었습니다.');
            };

            const handleDelete = () => {
                setModalState({
                    isOpen: true,
                    isConfirm: true,
                    title: '투표 삭제',
                    content: '정말로 이 투표를 삭제하시겠습니까? 관련된 모든 응답도 삭제됩니다.',
                    confirmText: '삭제',
                    onConfirm: async () => {
                        // Should also delete subcollection votes in production, but let's just delete the doc for now to save time, or do a small batch.
                        await db.collection(CONSTANTS.COLLECTIONS.POLLS).doc(poll.id).delete();
                        showToast('투표가 삭제되었습니다.');
                        onBack();
                        return true;
                    }
                });
            };

            // Helper to check if student's answer is correct
            const isCorrectAnswer = (q, myAns) => {
                if (!poll.isQuiz || !q.correctAnswer) return null;
                if (q.type === 'single') return myAns === q.correctAnswer;
                if (q.type === 'text') {
                    const answersArray = Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer];
                    return answersArray.some(ans => ans.trim() === (myAns || '').trim());
                }
                if (q.type === 'multiple') {
                    if (!Array.isArray(myAns) || !Array.isArray(q.correctAnswer)) return false;
                    if (myAns.length !== q.correctAnswer.length) return false;
                    return q.correctAnswer.every(val => myAns.includes(val));
                }
                if (q.type === 'grid') {
                    // Grid correctness is partial or all-or-nothing? Let's say all-or-nothing for the whole question points.
                    if (!myAns) return false;
                    return q.rows.every(row => myAns[row] === q.correctAnswer[row]);
                }
                return null;
            };

            const myScore = useMemo(() => {
                if (!poll.isQuiz || !hasVoted) return null;
                let score = 0;
                let maxScore = 0;
                poll.questions.forEach(q => {
                    if (q.type === 'rating') return;
                    maxScore += (q.points || 0);
                    if (isCorrectAnswer(q, responses[q.id])) {
                        score += (q.points || 0);
                    }
                });
                return { score, maxScore };
            }, [poll, hasVoted, responses]);

            const renderResults = (q) => {
                if (loadingResults) return <div className="text-sm text-gray-500">결과 로딩중...</div>;

                const myAns = responses[q.id];
                const isCorrect = isCorrectAnswer(q, myAns);

                // 학생 & 퀴즈 모드: 철저한 개인 시험지 모드 (통계 절대 미노출)
                if (poll.isQuiz && !isTeacher) {
                    if (poll.quizReleaseMode === 'manual' && !poll.scoresReleased) {
                        return <div className="p-4 bg-gray-50 border rounded-lg text-center font-bold text-gray-500 text-sm">점수가 아직 공개되지 않았습니다.</div>;
                    }
                    if (q.type === 'rating') return <div className="text-sm text-gray-400">별점 문항은 퀴즈 점수에 반영되지 않습니다.</div>;

                    const formatAns = (ans) => {
                        if (!ans) return '미응답';
                        if (q.type === 'grid' && typeof ans === 'object') return Object.entries(ans).map(([r, o]) => `${r}: ${o}`).join(' / ');
                        if (Array.isArray(ans)) return ans.join(', ');
                        return ans;
                    };

                    return (
                        <div className="mt-2 p-4 bg-gray-50 border rounded-lg shadow-sm">
                            <div className="mb-3">
                                <span className="font-bold text-gray-600 text-sm">내 응답:</span>
                                <div className="mt-1 text-gray-800 font-bold p-2 bg-white rounded border">
                                    {formatAns(myAns)}
                                </div>
                            </div>

                            <div className={`p-3 rounded-lg flex items-center justify-between border ${isCorrect ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'}`}>
                                <div className="font-bold flex items-center gap-2">
                                    {isCorrect ? '✅ 정답입니다!' : '❌ 오답입니다.'}
                                </div>
                                <div className="font-bold text-lg">{isCorrect ? (q.points || 0) : 0} <span className="text-sm">/ {q.points || 0}점</span></div>
                            </div>

                            {!isCorrect && (
                                <div className="mt-3 pt-3 border-t border-gray-200">
                                    <span className="font-bold text-red-600 text-sm">실제 정답:</span>
                                    <div className="mt-1 text-red-700 font-bold p-2 bg-red-50 rounded border border-red-100">
                                        {formatAns(q.correctAnswer)}
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }

                // 교사 모드이거나 일반 투표 모드인 경우: 전체 통계 표시
                let quizFeedback = null;
                // Teacher stats feedback was just simple indicators before, but now we'll inject it into the loops.


                if (q.type === 'rating') {
                    const validVotes = pollResults.map(v => parseInt(v.answers[q.id])).filter(v => !isNaN(v));
                    const avg = validVotes.length > 0 ? (validVotes.reduce((a, b) => a + b, 0) / validVotes.length).toFixed(1) : 0;

                    return (
                        <div>
                            <div className="flex items-center gap-4 mb-6 p-4 bg-purple-50 rounded-xl">
                                <div className="text-4xl text-yellow-400">★</div>
                                <div>
                                    <div className="text-sm text-purple-700 font-bold">평균 별점</div>
                                    <div className="text-3xl font-bold text-purple-900">{avg} <span className="text-lg text-purple-600">/ {q.maxRating || 5}</span></div>
                                </div>
                            </div>
                            {/* Simple bar chart for distribution */}
                            <div className="space-y-2">
                                {[...Array(q.maxRating || 5)].map((_, i) => {
                                    const ratingVal = (q.maxRating || 5) - i;
                                    const count = validVotes.filter(v => v === ratingVal).length;
                                    const percent = validVotes.length > 0 ? Math.round((count / validVotes.length) * 100) : 0;
                                    return (
                                        <div key={ratingVal} className="flex items-center gap-3 text-sm">
                                            <span className="w-8 text-right font-bold text-gray-500">{ratingVal}점</span>
                                            <div className="flex-1 bg-gray-100 h-3 rounded-full overflow-hidden">
                                                <div className="bg-yellow-400 h-full" style={{ width: `${percent}%` }}></div>
                                            </div>
                                            <span className="w-12 text-right text-gray-500">{count}명</span>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                }

                if (q.type === 'grid') {
                    const totalVotes = pollResults.filter(v => v.answers[q.id]).length;
                    return (
                        <div>
                            <div className="overflow-x-auto text-sm border rounded-lg">
                                <table className="min-w-full text-center bg-white">
                                    <thead className="bg-gray-50 border-b">
                                        <tr>
                                            <th className="p-3 border-r"></th>
                                            {q.options.map(opt => <th key={opt} className="p-3 border-r font-bold text-gray-700">{opt}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {q.rows?.map(row => {
                                            return (
                                                <tr key={row} className="border-b last:border-0 hover:bg-gray-50">
                                                    <td className="p-3 border-r text-left font-bold text-gray-800 whitespace-nowrap bg-gray-50">{row}</td>
                                                    {q.options.map(opt => {
                                                        const count = pollResults.filter(v => v.answers[q.id]?.[row] === opt).length;
                                                        const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                                                        const isCellCorrect = poll.isQuiz && q.correctAnswer?.[row] === opt;
                                                        return (
                                                            <td key={opt} className={`p-3 border-r relative ${isCellCorrect ? 'bg-green-50' : ''}`}>
                                                                <div className="font-bold text-purple-700 text-lg">{count}</div>
                                                                <div className="text-xs text-gray-400">({percent}%)</div>
                                                                {isCellCorrect && <div className="absolute top-1 right-1 text-xs text-green-600">✅정답</div>}
                                                            </td>
                                                        )
                                                    })}
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    );
                }

                if (q.type === 'text') {
                    const answers = pollResults.map(v => ({ text: v.answers[q.id], voter: v.voterName })).filter(a => a.text);
                    return (
                        <div className="mt-4 space-y-2 max-h-60 overflow-y-auto bg-gray-50 p-3 rounded">
                            {answers.length === 0 ? <p className="text-sm text-gray-500">응답이 없습니다.</p> : answers.map((ans, i) => (
                                <div key={i} className="bg-white p-2 border rounded shadow-sm text-sm">
                                    <p>{ans.text}</p>
                                    {!q.allowAnonymous && <span className="text-xs text-gray-400 mt-1 block">- {ans.voter}</span>}
                                </div>
                            ))}
                        </div>
                    );
                } else {
                    const counts = {};
                    q.options.forEach(opt => counts[opt] = 0);

                    pollResults.forEach(v => {
                        const ans = v.answers[q.id];
                        if (Array.isArray(ans)) {
                            ans.forEach(a => { if (counts[a] !== undefined) counts[a]++ });
                        } else {
                            if (counts[ans] !== undefined) counts[ans]++;
                        }
                    });

                    const maxCount = Math.max(...Object.values(counts), 1);
                    const totalVotes = pollResults.length;

                    return (
                        <div className="mt-4 space-y-3">
                            {q.options.map((opt, i) => {
                                const count = counts[opt];
                                const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                                return (
                                    <div key={i} className="mb-4">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="font-bold flex items-center gap-2">
                                                {opt}
                                                {(poll.isQuiz && isTeacher && (q.type === 'single' ? opt === q.correctAnswer : Array.isArray(q.correctAnswer) && q.correctAnswer.includes(opt))) && (
                                                    <span className="text-xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded border border-purple-200">✅ 정답</span>
                                                )}
                                            </span>
                                            <div className="flex items-center gap-3">
                                                {(!q.allowAnonymous && count > 0) && (
                                                    <button onClick={() => toggleVoters(`${q.id}-${i}`)} className="text-xs text-gray-400 hover:text-purple-600 underline">
                                                        {expandedVoters[`${q.id}-${i}`] ? '명단 닫기' : '명단 보기'}
                                                    </button>
                                                )}
                                                <span className="font-bold text-purple-600">{count}표 ({percent}%)</span>
                                            </div>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-2 mb-1">
                                            <div className="bg-purple-500 h-2 rounded-full transition-all duration-500" style={{ width: `${percent}%` }}></div>
                                        </div>
                                        {(expandedVoters[`${q.id}-${i}`] && !q.allowAnonymous && count > 0) && (
                                            <div className="text-xs text-gray-600 bg-gray-50 p-2 rounded mt-1 border border-gray-100">
                                                {pollResults.filter(v => {
                                                    const ans = v.answers[q.id];
                                                    return Array.isArray(ans) ? ans.includes(opt) : ans === opt;
                                                }).map(v => v.voterName).join(', ')}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    );
                }
            };

            return (
                <div className="max-w-4xl mx-auto relative">
                    <div className="flex justify-end mb-4">
                        <button onClick={onBack} className="flex items-center text-gray-500 hover:text-gray-800 transition-colors bg-white px-3 py-1.5 rounded-md shadow-sm border text-sm font-bold">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clipRule="evenodd" /></svg>
                            목록으로 돌아가기
                        </button>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-xl shadow-md mb-6 border-t-4 border-purple-500 relative">
                        <div className="flex flex-wrap justify-between items-start gap-4 mb-4">
                            <div className="flex-1">
                                <div className="flex items-center gap-2 mb-2">
                                    <span className={`inline-block text-xs font-bold px-2 py-1 rounded ${localStatus === 'active' ? 'bg-purple-100 text-purple-700' : localStatus === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700'}`}>
                                        {localStatus === 'active' ? '진행중' : localStatus === 'pending' ? '승인대기' : '마감됨'}
                                    </span>
                                    {isExpired && <span className="inline-block text-xs font-bold px-2 py-1 rounded bg-red-100 text-red-700">기한 만료</span>}
                                </div>
                                <h2 className="text-3xl font-bold text-gray-800">{poll.title}</h2>
                            </div>
                            {canManage && (
                                <div className="flex flex-wrap gap-2 justify-end">
                                    {localStatus === 'pending' && isTeacher && <button onClick={handleApprove} className="btn-green !px-3 !py-1 text-sm">승인</button>}
                                    {localStatus === 'active' && <button onClick={handleClose} className="btn-gray !px-3 !py-1 text-sm">마감하기</button>}
                                    {localStatus === 'closed' && <button onClick={handleReopen} className="btn-sky !px-3 !py-1 text-sm">마감취소</button>}
                                    {(canManage && poll.isQuiz && poll.quizReleaseMode === 'manual' && !poll.scoresReleased) && (
                                        <button onClick={handleReleaseScores} className="px-3 py-1 text-sm rounded-md font-bold transition-colors shadow-sm bg-yellow-400 hover:bg-yellow-500 text-yellow-900 border border-yellow-500">점수 공개하기</button>
                                    )}
                                    <button onClick={onCopy} className="btn-gray !px-3 !py-1 text-sm">복사</button>
                                    <button onClick={onEdit} className="btn-sky !px-3 !py-1 text-sm">수정</button>
                                    <button onClick={handleDelete} className="btn-red !px-3 !py-1 text-sm">삭제</button>
                                </div>
                            )}
                        </div>

                        {poll.description && <p className="text-gray-600 mb-6 whitespace-pre-wrap">{poll.description}</p>}

                        <div className="flex gap-4 text-sm text-gray-500 border-t pt-4 flex-wrap">
                            <span>작성자: {poll.creatorName}</span>
                            <span>작성일: {new Date(poll.createdAt).toLocaleDateString()}</span>
                            {poll.deadline && <span className="text-red-500 font-bold">마감 기한: {new Date(poll.deadline).toLocaleString()}</span>}
                            <span>참여자 수: {pollResults.length}명</span>
                            {poll.type === 'union' && poll.targetClassIds && classes && (
                                <span className="text-purple-600 font-bold">대상 학급: {poll.targetClassIds.map(id => classes.find(c => c.id === id)?.className || '알 수 없는 학급').join(', ')}</span>
                            )}
                        </div>
                    </div>

                    <div className="space-y-6">
                        {poll.questions.map((q, i) => (
                            <div key={q.id} className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                <div className="mb-4 flex items-center justify-between gap-4">
                                    <h3 className="text-xl font-bold text-gray-800"><span className="text-purple-500 mr-2">Q{i + 1}.</span>{q.text}</h3>
                                    {q.allowAnonymous && <span className="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded flex-shrink-0">익명 허용</span>}
                                </div>

                                {(!hasVoted && localStatus === 'active' && !isExpired && !(isTeacher && poll.isQuiz)) ? (
                                    <div className="space-y-3">
                                        {q.type === 'single' && q.options.map(opt => (
                                            <label key={opt} className={`block p-3 border rounded-lg cursor-pointer transition-colors ${responses[q.id] === opt ? 'bg-purple-50 border-purple-400' : 'hover:bg-gray-50'}`}>
                                                <input type="radio" name={q.id} value={opt} checked={responses[q.id] === opt} onChange={() => handleOptionSelect(q.id, 'single', opt)} className="mr-3" />
                                                {opt}
                                            </label>
                                        ))}
                                        {q.type === 'multiple' && q.options.map(opt => (
                                            <label key={opt} className={`block p-3 border rounded-lg cursor-pointer transition-colors ${(responses[q.id] || []).includes(opt) ? 'bg-purple-50 border-purple-400' : 'hover:bg-gray-50'}`}>
                                                <input type="checkbox" name={q.id} value={opt} checked={(responses[q.id] || []).includes(opt)} onChange={() => handleOptionSelect(q.id, 'multiple', opt)} className="mr-3" />
                                                {opt}
                                            </label>
                                        ))}
                                        {q.type === 'text' && (
                                            <textarea value={responses[q.id] || ''} onChange={e => handleOptionSelect(q.id, 'text', e.target.value)} className="w-full p-3 border rounded-lg focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none" rows="3" placeholder="답변을 입력하세요..."></textarea>
                                        )}
                                    </div>
                                ) : (
                                    <div className="mt-4 border-t pt-4">
                                        <h4 className="text-sm font-bold text-gray-600 mb-2">투표 결과</h4>
                                        {(isTeacher || hasVoted || localStatus === 'closed') ? renderResults(q) : <p className="text-sm text-gray-500">투표 후에 결과를 확인할 수 있습니다.</p>}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* 교사 퀴즈 모드일 때 학생 점수 확인 버튼 */}
                    {(isTeacher && poll.isQuiz) ? (
                        <div className="mt-8 flex justify-center">
                            <button onClick={handleViewStudentScores} className="btn-purple !px-12 !py-4 text-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
                                학생 점수 확인하기
                            </button>
                        </div>
                    ) : (!hasVoted && localStatus === 'active') ? (
                        <div className="mt-8 flex justify-center">
                            <button onClick={handleSubmitVote} disabled={submitting} className="btn-purple !px-12 !py-4 text-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
                                {submitting ? '제출중...' : '투표 제출하기'}
                            </button>
                        </div>
                    ) : null}

                    {(!isTeacher || !poll.isQuiz) && hasVoted && (
                        <div className="mt-8 text-center bg-purple-50 p-6 rounded-xl border border-purple-200">
                            <p className="text-purple-600 font-bold text-lg mb-2">✅ 이미 투표를 완료했습니다.</p>
                            <div className="flex justify-center gap-2 mt-4">
                                {poll.allowRevote && localStatus === 'active' && !isExpired && (
                                    <button onClick={() => setHasVoted(false)} className="btn-sky !px-4 !py-2 text-sm">응답 수정하기</button>
                                )}
                                {!isTeacher && <button onClick={fetchResults} className="btn-gray !px-4 !py-2 text-sm flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>새로고침</button>}
                            </div>
                        </div>
                    )}

                    {(!isTeacher || !poll.isQuiz) && (!hasVoted && (localStatus === 'closed' || isExpired)) && (
                        <div className="mt-8 text-center text-gray-500 font-bold text-lg bg-gray-50 p-6 rounded-xl">
                            ❌ 투표가 마감되어 참여할 수 없습니다.
                        </div>
                    )}
                </div>
            );
        };

        // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
        // ★★★★★                 컴포넌트 종료                 ★★★★★
        // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

        const Dashboard = ({ user, initialUserData, onLogout, showToast }) => {
            const [userData, setUserData] = useState(initialUserData);
            const [isSidebarExpanded, setIsSidebarExpanded] = useState(true);
            const [currentMenu, setCurrentMenu] = useState('schedule');
            const [classes, setClasses] = useState([]);
            const [selectedClassId, setSelectedClassId] = useState('');
            const [classData, setClassData] = useState({ students: [], pendingStudents: [] });
            const [loading, setLoading] = useState({ classes: true, classData: true });
            const [modalState, setModalState] = useState({ isOpen: false });
            const [isClassCodeVisible, setIsClassCodeVisible] = useState(true);

            const isTeacher = user.role === 'teacher';
            const isAdmin = user.email === CONSTANTS.ADMIN_ACCOUNT;
            const selectedClass = useMemo(() => classes.find(cls => cls.id === selectedClassId), [classes, selectedClassId]);

            useEffect(() => {
                if (!user?.uid) return;
                const collectionName = user.role === 'teacher' ? CONSTANTS.COLLECTIONS.TEACHERS : CONSTANTS.COLLECTIONS.STUDENTS;
                const unsub = db.collection(collectionName).doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) setUserData(doc.data());
                });
                return () => unsub();
            }, [user.uid, user.role]);

            useEffect(() => {
                let unsub = () => { };
                if (isTeacher) {
                    unsub = db.collection(CONSTANTS.COLLECTIONS.CLASSES)
                        .where('teacherId', '==', user.uid)
                        .onSnapshot(snapshot => {
                            const classList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            classList.sort((a, b) => a.className.localeCompare(b.className));
                            setClasses(classList);
                            if (classList.length > 0 && (!selectedClassId || !classList.some(c => c.id === selectedClassId))) {
                                setSelectedClassId(classList[0].id);
                            } else if (classList.length === 0) {
                                setSelectedClassId('');
                            }
                            setLoading(prev => ({ ...prev, classes: false }));
                        });
                } else {
                    const unsubStudent = db.collection('students').doc(user.uid).onSnapshot(async (studentDoc) => {
                        if (studentDoc.exists) {
                            const studentProfile = studentDoc.data();
                            const approvedClassIds = Object.keys(studentProfile.approvedBy || {}).filter(key => studentProfile.approvedBy[key]);

                            if (approvedClassIds.length > 0) {
                                const classPromises = approvedClassIds.map(id => db.collection('classes').doc(id).get());
                                const classDocs = await Promise.all(classPromises);
                                let classList = classDocs.filter(doc => doc.exists).map(doc => ({ id: doc.id, ...doc.data() }));
                                classList.sort((a, b) => a.className.localeCompare(b.className));
                                setClasses(classList);
                                if (classList.length > 0 && (!selectedClassId || !classList.some(c => c.id === selectedClassId))) {
                                    setSelectedClassId(classList[0].id);
                                } else if (classList.length === 0) {
                                    setSelectedClassId('');
                                }
                            } else {
                                setClasses([]);
                                setSelectedClassId('');
                            }
                        }
                        setLoading(prev => ({ ...prev, classes: false }));
                    });
                    return () => unsubStudent();
                }
                return () => unsub();
            }, [user.uid, isTeacher, selectedClassId]);

            useEffect(() => {
                if (!selectedClassId || !isTeacher) {
                    setClassData({ students: [], pendingStudents: [] });
                    setLoading(prev => ({ ...prev, classData: false }));
                    return;
                }
                setLoading(prev => ({ ...prev, classData: true }));
                const studentsUnsub = db.collection(CONSTANTS.COLLECTIONS.STUDENTS).where('classIds', 'array-contains', selectedClassId).onSnapshot(snapshot => {
                    const allStudentsInClass = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setClassData({
                        students: allStudentsInClass.filter(s => s.approvedBy?.[selectedClassId]).sort((a, b) => String(a.studentId).localeCompare(String(b.studentId))),
                        pendingStudents: allStudentsInClass.filter(s => !s.approvedBy?.[selectedClassId]).sort((a, b) => String(a.studentId).localeCompare(String(b.studentId)))
                    });
                    setLoading(prev => ({ ...prev, classData: false }));
                });
                return () => studentsUnsub();
            }, [selectedClassId, isTeacher]);

            const approveStudent = async (studentId) => {
                if (!selectedClassId) return;
                await db.collection('students').doc(studentId).set({ approvedBy: { [selectedClassId]: true } }, { merge: true });
            };
            const rejectStudent = async (studentId) => {
                if (!selectedClassId) return;
                await db.collection('students').doc(studentId).set({ classIds: FieldValue.arrayRemove(selectedClassId), approvedBy: { [selectedClassId]: FieldValue.delete() } }, { merge: true });
            };
            const deleteStudent = (studentToDelete) => {
                setModalState({ isOpen: true, isConfirm: true, title: '학생 제외 확인', content: `'${studentToDelete.name}' 학생을 학급에서 제외하시겠습니까?`, onConfirm: async () => { await db.collection('students').doc(studentToDelete.id).set({ classIds: FieldValue.arrayRemove(selectedClassId), approvedBy: { [selectedClassId]: FieldValue.delete() } }, { merge: true }); return true; } });
            };
            const inviteStudent = async (studentToInvite, targetClassId) => {
                await db.collection('students').doc(studentToInvite.id).set({ classIds: FieldValue.arrayUnion(targetClassId), approvedBy: { [targetClassId]: true } }, { merge: true });
            };
            const updateClass = async (classId, data) => {
                await db.collection('classes').doc(classId).update(data);
            };
            const deleteClass = (classItem) => { // classId 대신 classItem 객체 전체를 받도록 수정
                const classIdToDelete = classItem.id;
                setModalState({
                    isOpen: true, isConfirm: true, title: '학급 삭제 확인',
                    content: `'${classItem.className}' 학급을 정말로 삭제하시겠습니까? 학급에 속한 모든 학생 정보, 점수, 일정이 함께 삭제되며 복구할 수 없습니다.`,
                    confirmText: '삭제',
                    onConfirm: async () => {
                        try {
                            const studentsSnap = await db.collection('students').where('classIds', 'array-contains', classIdToDelete).get();
                            const studentBatch = db.batch();
                            studentsSnap.forEach(doc => {
                                studentBatch.set(doc.ref, {
                                    classIds: FieldValue.arrayRemove(classIdToDelete),
                                    approvedBy: { [classIdToDelete]: FieldValue.delete() }
                                }, { merge: true });
                            });
                            await studentBatch.commit();

                            await db.collection('schedules').doc(classIdToDelete).delete();
                            await db.collection('assessments').doc(classIdToDelete).delete();
                            await db.collection('scores').doc(classIdToDelete).delete().catch(e => console.log("Scores doc not found, skipping delete."));
                            await db.collection('classes').doc(classIdToDelete).delete();

                            setModalState({ isOpen: true, title: "삭제 완료", content: "학급이 성공적으로 삭제되었습니다." });
                            return true;

                        } catch (error) {
                            console.error("학급 삭제 실패:", error);
                            setModalState({ isOpen: true, title: "삭제 실패", content: `학급 삭제 중 오류가 발생했습니다: ${error.message}` });
                            return false;
                        }
                    }
                });
            };

            const teacherMenuItems = [
                { id: 'schedule', label: '일정 관리', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg> },
                { id: 'students', label: '학생 관리', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg> },
                { id: 'scores', label: '수행 점수', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg> },
                { id: 'test-scores', label: '시험 점수', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg> },
                { id: 'team-builder', label: '랜덤 팀 구성', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a3.002 3.002 0 012.288-2.542M11.644 16.143a3.003 3.003 0 011.712-2.542m0 0A3 3 0 0115 11.236V10c0-1.657-1.343-3-3-3S9 8.343 9 10v1.236A3 3 0 0111.644 16.143z" /></svg> },
                { id: 'seating-chart', label: '랜덤 자리배치', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 8v8m-3-5v5m-3-8v8M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z" /></svg> },
                { id: 'polls', label: '설문/투표', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg> },
                { id: 'class', label: '학급 관리', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg> },
            ];

            const studentMenuItems = [
                { id: 'schedule', label: '일정 확인', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg> },
                { id: 'scores', label: '수행 점수', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg> },
                { id: 'test-scores', label: '시험 점수', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg> },
                { id: 'my-team', label: '나의 팀 구성', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a3.002 3.002 0 012.288-2.542M11.644 16.143a3.003 3.003 0 011.712-2.542m0 0A3 3 0 0115 11.236V10c0-1.657-1.343-3-3-3S9 8.343 9 10v1.236A3 3 0 0111.644 16.143z" /></svg> },
                { id: 'polls', label: '설문/투표', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg> },
                { id: 'info', label: '내 정보', icon: <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg> }
            ];

            const menuItems = isTeacher ? teacherMenuItems : studentMenuItems;
            const themeColor = isTeacher ? 'sky' : 'rose';

            const renderContent = () => {
                if (loading.classes || (isTeacher && loading.classData)) return <div className="h-full w-full skeleton"></div>;

                if (!selectedClassId && !['class', 'info', 'team-builder', 'seating-chart', 'polls'].includes(currentMenu)) {
                    return <div className="text-center text-gray-500 p-10 bg-white rounded-lg shadow-md"><p className="text-xl font-bold">참여 중인 학급이 없습니다.</p><p className="mt-2">{isTeacher ? "'학급 관리' 메뉴에서 학급을 생성해주세요." : "아직 승인된 학급이 없습니다."}</p></div>;
                }

                switch (currentMenu) {
                    case 'schedule':
                        return <ScheduleCalendar classes={classes} selectedClass={selectedClass} selectedClassId={selectedClassId} students={classData.students} teacherId={user.uid} isTeacher={isTeacher} setModalState={setModalState} showToast={showToast} />;
                    case 'students':
                        return isTeacher ? <StudentManagement students={classData.students} pendingStudents={classData.pendingStudents} deleteStudent={deleteStudent} approveStudent={approveStudent} rejectStudent={rejectStudent} inviteStudent={inviteStudent} classes={classes} setModalState={setModalState} selectedClass={selectedClass} showToast={showToast} /> : null;
                    case 'scores':
                        return <PerformanceScoreManager isTeacher={isTeacher} userData={userData} selectedClass={selectedClass} setModalState={setModalState} showToast={showToast} />;
                    case 'test-scores':
                        return <TestScoreViewer isTeacher={isTeacher} userData={userData} selectedClass={selectedClass} setModalState={setModalState} showToast={showToast} />;
                    case 'team-builder':
                        return isTeacher ? <TeamBuilder propStudents={classData.students} selectedClass={selectedClass} setModalState={setModalState} showToast={showToast} /> : null;
                    case 'seating-chart':
                        return isTeacher ? <SeatingChart propStudents={classData.students} selectedClass={selectedClass} setModalState={setModalState} showToast={showToast} /> : null;
                    case 'class':
                        return isTeacher ? <ClassManagement teacherId={user.uid} classes={classes} setModalState={setModalState} onUpdateClass={updateClass} onDeleteClass={deleteClass} isAdmin={isAdmin} showToast={showToast} /> : null;
                    case 'my-team':
                        return <StudentTeamView selectedClass={selectedClass} />;
                    case 'polls':
                        return <PollDashboard user={user} userData={userData} classes={classes} selectedClass={selectedClass} selectedClassId={selectedClassId} classData={classData} setModalState={setModalState} showToast={showToast} />;
                    case 'info':
                        return <UserInfo user={user} userData={userData} setModalState={setModalState} showToast={showToast} />;
                    default:
                        return null;
                }
            };

            return (
                <div className="flex h-screen bg-gray-100">
                    <Modal modalState={modalState} setModalState={setModalState} />
                    <aside className={`sidebar bg-white shadow-lg flex flex-col z-20 absolute md:relative inset-y-0 left-0 transform md:transform-none ${isSidebarExpanded ? "w-64" : "w-20"} ${isSidebarExpanded ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="flex flex-col flex-grow overflow-y-hidden">
                            <div className="flex-shrink-0 flex items-center justify-center p-2 border-b relative" style={{ minHeight: '60px' }}>
                                {isSidebarExpanded && <span className={`text-2xl font-bold text-${themeColor}-500`}>기가지현</span>}
                                <button onClick={() => setIsSidebarExpanded(!isSidebarExpanded)} className="p-2 rounded-lg hover:bg-gray-100 absolute top-3 right-3">{isSidebarExpanded ? <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" /></svg> : <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>}</button>
                            </div>
                            <div className="flex-grow overflow-y-auto p-2">
                                {isSidebarExpanded ? (
                                    <div>
                                        <p className="text-sm text-gray-500 mt-2 mb-4 text-center">{userData.name} {isTeacher ? '선생님' : '학생'}</p>
                                        {isTeacher && (
                                            <div className="my-4 mx-2">
                                                <div className="flex items-center justify-center mb-2 cursor-pointer" onClick={() => setIsClassCodeVisible(prev => !prev)}>
                                                    <label className="text-sm font-bold text-gray-600">현재 학급 코드</label>
                                                    <svg xmlns="http://www.w3.org/2000/svg" className={`h-5 w-5 ml-1 text-gray-500 transition-transform ${isClassCodeVisible ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                                    </svg>
                                                </div>
                                                {isClassCodeVisible && (
                                                    // ★★★ 이 div에 onClick 이벤트와 스타일 수정을 적용합니다. ★★★
                                                    <div
                                                        className="w-full bg-sky-100 text-sky-800 rounded-lg p-4 flex items-center justify-center h-24 cursor-pointer transition hover:bg-sky-200"
                                                        onClick={() => {
                                                            if (selectedClass?.classCode) {
                                                                navigator.clipboard.writeText(selectedClass.classCode);
                                                                showToast("학급 코드가 복사되었습니다!");
                                                            }
                                                        }}
                                                        title="클릭하여 복사"
                                                    >
                                                        {loading.classes ? (<div className="h-12 w-40 mx-auto skeleton"></div>) : (<p className="text-4xl font-black tracking-widest text-center">{selectedClass?.classCode || '----'}</p>)}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        <div className="my-4 px-2">
                                            <label htmlFor="class-select" className="text-sm font-bold text-gray-600 mb-2 block">학급 전환</label>
                                            <select id="class-select" className="w-full border rounded-lg p-2 bg-gray-50" value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} disabled={classes.length === 0}>
                                                {classes.length > 0 ? (classes.map(cls => <option key={cls.id} value={cls.id}>{cls.className}</option>)) : (<option>참여 학급 없음</option>)}
                                            </select>
                                        </div>
                                    </div>
                                ) : (<div className="my-4 text-center"><p className={`text-xs font-bold text-gray-600 truncate p-2 bg-${themeColor}-100 rounded-md`}>{selectedClass?.className || 'N/A'}</p></div>)}
                                <nav className="space-y-1">{menuItems.map(item => (<button key={item.id} onClick={() => setCurrentMenu(item.id)} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors ${!isSidebarExpanded && 'justify-center'} ${currentMenu === item.id ? `bg-${themeColor}-500 text-white font-bold shadow` : `text-gray-600 hover:bg-gray-100`}`} title={isSidebarExpanded ? '' : item.label}>{item.icon}{isSidebarExpanded && <span>{item.label}</span>}</button>))} </nav>
                            </div>
                        </div>
                        <div className="p-2 border-t border-gray-200 flex-shrink-0">
                            <button onClick={onLogout} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-200 ${!isSidebarExpanded && 'justify-center'}`} title={isSidebarExpanded ? '' : "로그아웃"}><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>{isSidebarExpanded && <span>로그아웃</span>}</button>
                        </div>
                    </aside>
                    <div className="flex-1 flex flex-col">
                        <button onClick={() => setIsSidebarExpanded(true)} className="md:hidden p-2 bg-white/50 backdrop-blur-sm rounded-full shadow-md fixed top-4 left-4 z-10"><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg></button>
                        <main className="flex-1 p-4 sm:p-8 overflow-y-auto">{renderContent()}</main>
                    </div>
                </div>
            );
        };

        // --- 메인 App 컴포넌트 ---
        function App() {
            const [user, setUser] = useState(undefined);
            const [userData, setUserData] = useState(null);
            const [view, setView] = useState('initial');
            const [error, setError] = useState('');
            const [modalState, setModalState] = useState({ isOpen: false });
            const { toast, showToast } = useToast(); // <-- 훅 호출


            useEffect(() => {
                const authUnsub = auth.onAuthStateChanged(async authUser => {
                    if (authUser) {
                        const teacherDoc = await db.collection(CONSTANTS.COLLECTIONS.TEACHERS).doc(authUser.uid).get();
                        if (teacherDoc.exists) {
                            setUser({ uid: authUser.uid, email: authUser.email, role: 'teacher' });
                            setUserData(teacherDoc.data()); return;
                        }
                        const studentDoc = await db.collection(CONSTANTS.COLLECTIONS.STUDENTS).doc(authUser.uid).get();
                        if (studentDoc.exists) {
                            setUser({ uid: authUser.uid, email: authUser.email, role: 'student' });
                            setUserData(studentDoc.data()); return;
                        }
                        auth.signOut();
                    } else {
                        setUser(null); setUserData(null); setView('initial');
                    }
                });
                return () => authUnsub();
            }, []);

            const handleGoogleLogin = async (role) => {
                setError('');
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                try {
                    const result = await auth.signInWithPopup(provider);
                    const gUser = result.user;
                    const email = gUser.email;

                    if (!email.endsWith(`@${CONSTANTS.SCHOOL_DOMAIN}`)) {
                        await auth.signOut();
                        setError(`'${CONSTANTS.SCHOOL_DOMAIN}' 학교 계정으로만 로그인이 가능합니다.`);
                        return;
                    }

                    const authorizedTeacherDoc = await db.collection(CONSTANTS.COLLECTIONS.AUTHORIZED_TEACHERS).doc(email).get();

                    if (role === 'teacher') {
                        if (!authorizedTeacherDoc.exists) {
                            await auth.signOut();
                            setError(`승인되지 않은 교사 계정입니다. 관리자에게 문의하세요.`);
                            return;
                        }
                    } else if (role === 'student') {
                        if (authorizedTeacherDoc.exists) {
                            await auth.signOut();
                            setError(`교사로 등록된 계정입니다. '교사'로 로그인해주세요.`);
                            return;
                        }
                    }

                    const collectionName = role === 'teacher' ? 'teachers' : 'students';
                    const userRef = db.collection(collectionName).doc(gUser.uid);
                    const userDoc = await userRef.get();
                    if (!userDoc.exists) {
                        if (role === 'student') {
                            const displayName = gUser.displayName || '';
                            let studentId = ''; let name = displayName;

                            if (displayName && /^\d{4}/.test(displayName) && displayName.length > 4) {
                                studentId = displayName.substring(0, 4);
                                name = displayName.substring(4).trim();
                            }

                            // 동기화된 명부(schoolRoster) 확인
                            try {
                                const rosterDoc = await db.collection('schoolRoster').doc(gUser.email).get();
                                if (rosterDoc.exists) {
                                    const rosterData = rosterDoc.data();
                                    studentId = rosterData.studentId || studentId;
                                    name = rosterData.name || name;
                                }
                            } catch (e) {
                                console.error("명부 조회 실패:", e);
                            }

                            const newUserProfile = { name, schoolAccount: gUser.email, studentId, classIds: [], approvedBy: {} };
                            await userRef.set(newUserProfile);
                            setModalState({ isOpen: true, title: '첫 로그인', content: '계정이 생성되었습니다! 선생님이 학급에 초대하고 승인하면 서비스 이용이 가능합니다.' });
                        } else {
                            const newUserProfile = { name: gUser.displayName || '이름 없음', schoolAccount: gUser.email };
                            await userRef.set(newUserProfile);
                            setModalState({ isOpen: true, title: '환영합니다!', content: '교사 계정이 생성되었습니다. \'학급 관리\' 메뉴에서 첫 학급을 만들어주세요.' });
                        }
                    }
                } catch (err) {
                    setError(mapAuthCodeToMessage(err.code));
                }
            };

            if (user === undefined) return <div className="min-h-screen flex items-center justify-center text-xl">로딩 중...</div>;
            if (user && userData) {
                return (
                    <StudentCacheProvider setModalState={setModalState}>
                        <Toast message={toast.message} isVisible={toast.isVisible} />
                        <Dashboard
                            user={user}
                            initialUserData={userData}
                            onLogout={() => auth.signOut()}
                            showToast={showToast}
                            setModalState={setModalState}
                        />
                    </StudentCacheProvider>
                );
            }
            const InitialScreen = ({ onSelectRole }) => (
                <div className="w-full max-w-md bg-white/70 backdrop-blur-sm rounded-2xl shadow-xl p-8 text-center">
                    <div className="space-y-4 mt-6">
                        <button onClick={() => onSelectRole('studentLogin')} className="w-full btn-rose py-3">학생</button>
                        <button onClick={() => onSelectRole('teacherLogin')} className="w-full btn-sky py-3">교사</button>
                    </div>
                </div>
            );

            const LoginScreen = ({ role, onLogin, onBack }) => {
                const isTeacher = role === 'teacher';
                return (
                    <div className="w-full max-w-md bg-white/70 backdrop-blur-sm rounded-2xl shadow-xl p-8 text-center">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6">{isTeacher ? '교사 로그인' : '학생 로그인'}</h2>
                        <button onClick={() => onLogin(role)} className="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-50 transition-colors">
                            <svg className="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C39.99,34.556,44,28.717,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg>
                            Google 계정으로 로그인
                        </button>
                        <div className="text-sm text-center mt-6">
                            <a href="#" onClick={(e) => { e.preventDefault(); onBack(); }} className="font-medium text-gray-600">뒤로가기</a>
                        </div>
                    </div>
                );
            };

            let authView;
            switch (view) {
                case 'teacherLogin': authView = <LoginScreen role="teacher" onLogin={handleGoogleLogin} onBack={() => setView('initial')} />; break;
                case 'studentLogin': authView = <LoginScreen role="student" onLogin={handleGoogleLogin} onBack={() => setView('initial')} />; break;
                default: authView = <InitialScreen onSelectRole={setView} />;
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-rose-100 to-sky-200 flex flex-col">
                    <main className="flex-grow flex flex-col justify-center items-center p-4">
                        <Toast message={toast.message} isVisible={toast.isVisible} />
                        <Modal modalState={modalState} setModalState={setModalState} />
                        <div className="text-center mb-8">
                            <h1 className="text-5xl font-bold text-slate-800">기가지현</h1>
                            <p className="text-slate-600 mt-2">스마트한 학급 운영의 시작</p>
                        </div>
                        {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-md relative mb-4 w-full max-w-md cursor-pointer" onClick={() => setError('')}>{error}</div>}
                        <div className="w-full max-w-md">{authView}</div>
                    </main>
                    <footer className="text-center py-4"><p className="text-xs text-slate-500">© 2025. {CONSTANTS.ADMIN_ACCOUNT}</p></footer>
                </div>
            );
        }
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '20px', background: '#ffebee', color: '#c62828', fontFamily: 'monospace' }}>
                            <h2>Something went wrong.</h2>
                            <details style={{ whiteSpace: 'pre-wrap' }}>
                                {this.state.error && this.state.error.toString()}
                                <br />
                                {this.state.errorInfo && this.state.errorInfo.componentStack}
                            </details>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
    </script>
</body>

</html>
